name: Smoke test against live

# Runs after a merge to main. smoke.js waits for Pages to publish this
# commit before it checks the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node smoke.js
