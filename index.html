<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#171331;       /* deepest dusk */
    --indigo:#241E44;      /* middle of the backdrop */
    --horizon:#4A3A78;     /* pale violet at the horizon */
    --water-hi:#6FE7D4;    /* turquoise water, surface */
    --water-lo:#2FB7A6;    /* turquoise water, depth */
    --foam:#D8FFF6;        /* wave foam */
    --chalk:#F3EFFF;       /* text, lavender white */
    --haze:#A79FC9;        /* secondary text */
    --amber:#FFB458;       /* stars */
    --hint:#FFB458;        /* the hint flash on the vessel */
    --gold:#FFCE7A;        /* goal reached */
    --mint:#8FE3A8;        /* "Easy" badge */
    --hard:#FF8A93;        /* "Hard" badge */
    --done:#6FE7D4;        /* cleared level, in the picker */
    --glass:rgba(240,238,255,.60);  /* vessel outline */
    --tint:rgba(243,239,255,.07);   /* glass body */
    --etch:rgba(243,239,255,.55);   /* capacity engraved on the vessel */
    /* The live amount, in the colour of the liquid itself. It shares a
       line of sight with the etched capacity, and two numbers in the same
       lavender white were being read for each other. */
    --amount:#6FE7D4;
    --on-primary:#0B2B26;  /* text on the primary button */
    --panel:rgba(255,255,255,.07);
    --panel-edge:rgba(255,255,255,.14);
    --card:rgba(16,64,76,.92);
    --scrim:rgba(4,22,28,.60);
  }
  /* The Winez skin: red wine in stemware, measured in U.
     Deliberately not in a menu - three taps on the logo droplet reach it
     (see the tap counter at the bottom of the script). It is the same set
     of properties redefined, so the token names still say "water": a skin
     is a second block, not a rename across the file. --on-primary is the
     one value a straight swap cannot cover, because dark text works on
     turquoise and fails on ruby. */
  html[data-skin="wine"]{
    --night:#150610;
    --indigo:#2C0D1D;
    --horizon:#63213F;
    --water-hi:#B32744;
    --water-lo:#59091F;
    --foam:#F0A8B8;
    --chalk:#F9EDF1;
    --haze:#BE9AA8;
    --amber:#FFC46A;
    --hint:#FFC46A;
    --gold:#FFD79A;
    --mint:#A9D6AE;
    --hard:#FF8E63;
    /* Ruby on burgundy is the same hue as the card behind it, so a cleared
       level borrows the meniscus rose instead of the liquid colour. */
    --done:#F0A8B8;
    --glass:rgba(255,244,248,.55);
    --tint:rgba(255,240,246,.06);
    --etch:rgba(255,240,246,.55);
    /* Ruby again disappears into the burgundy, so the amount borrows the
       meniscus rose, same as --done. */
    --amount:#F0A8B8;
    --on-primary:#FFF0F4;
    --panel:rgba(255,255,255,.06);
    --panel-edge:rgba(255,235,242,.13);
    --card:rgba(70,12,30,.94);
    --scrim:rgba(24,4,12,.62);
  }
  /* The Beerz skin: a German stein of lager, measured in S for Seidel.
     Third in the same chain of three taps. Two values a straight swap
     cannot carry, both for the same reason - the liquid itself is now
     amber, so anything that used to signal against turquoise or ruby by
     being golden has nowhere to stand:

     --hint  the hint flash strokes the vessel, and an amber outline over
             amber beer is no flash at all. It was --amber everywhere
             until now, which is why it has just become its own token.
     --gold  marks the amount the level asked for. Beer is gold already,
             so the goal state moves the other way instead - up into the
             pale, foam-lit cream - rather than to a warmer gold nobody
             could tell from --amount. */
  html[data-skin="beer"]{
    --night:#140C05;
    --indigo:#2A1A0B;
    --horizon:#6B4116;
    --water-hi:#F5C242;
    --water-lo:#A85E10;
    --foam:#FFF6E4;
    --chalk:#FBF3E6;
    --haze:#BFA983;
    --amber:#FFC85E;
    /* Cold on purpose: it is the one cue that must never be mistaken for
       beer, and white is already what a selected stein turns. */
    --hint:#7ED8FF;
    --gold:#FFF3C0;
    --mint:#9BD98A;
    --hard:#FF8A6B;
    /* Gold on a brown card keeps its distance, unlike ruby on burgundy,
       so a cleared level can simply be the liquid here. */
    --done:#F5C242;
    --glass:rgba(255,248,235,.62);
    --tint:rgba(255,245,225,.07);
    --etch:rgba(255,245,225,.55);
    --amount:#F5C242;
    --on-primary:#3A2205;
    --panel:rgba(255,255,255,.06);
    --panel-edge:rgba(255,236,205,.14);
    --card:rgba(58,34,12,.94);
    --scrim:rgba(20,10,3,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(130% 90% at 50% -10%, var(--horizon) 0%, var(--indigo) 45%, var(--night) 100%) fixed;
    color:var(--chalk);
    font-family:'Fredoka',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px 24px; min-height:100dvh;
    overflow-x:hidden;
  }
  header,.goal,.stage,.controls{position:relative;z-index:1}


  header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .wordmark{
    display:flex;align-items:baseline;gap:6px;position:relative;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  /* The hit area. The wordmark box hugs its own text - about 90x27 px,
     and the droplet inside it is 9 px across - so aiming at the logo on a
     phone mostly misses it. This lays a ~48 px-tall target over the whole
     thing without moving anything. It also settles which element takes
     the hit: the h1 paints through background-clip:text and the droplet
     carries a filter while it pings, and neither is dependable. */
  .wordmark::after{content:'';position:absolute;inset:-16px -20px}
  .wordmark>*{pointer-events:none}
  .wordmark h1{
    font-weight:700;font-size:1.7rem;letter-spacing:.01em;
    background:linear-gradient(180deg,var(--foam),var(--water-hi));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .droplet{
    width:.55rem;height:.55rem;border-radius:0 50% 50% 50%;
    transform:rotate(45deg) translateY(-4px);
    background:linear-gradient(135deg,var(--foam),var(--water-hi));
    transition:transform .5s cubic-bezier(.5,1.6,.5,1);
  }
  /* The droplet turns with the skin: it pours over into the wine, and
     comes up round as a bubble of foam in the beer. It keeps turning the
     same way through the chain rather than toggling back and forth. */
  html[data-skin="wine"] .droplet{transform:rotate(225deg) translateY(-4px)}
  html[data-skin="beer"] .droplet{border-radius:50%;transform:rotate(405deg) translateY(-4px)}
  /* Lighting up rather than moving: the droplet's transform already
     carries the tipped state, and a keyframe on it would snap the skin. */
  .droplet.ping{animation:ping .3s ease}
  @keyframes ping{50%{filter:brightness(1.8) drop-shadow(0 0 7px var(--foam))}}
  .lvltag{font-size:.82rem;color:var(--haze);font-weight:500}
  .diff{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:600;margin-left:6px;vertical-align:1px}
  /* The rgba line is the fallback for browsers without color-mix; without
     it a skin swap would leave the badge tinted for the wrong liquid. */
  .diff.easy{background:rgba(123,232,176,.16);background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
  .diff.mid{background:rgba(255,180,88,.16);background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .diff.hard{background:rgba(255,138,147,.16);background:color-mix(in srgb,var(--hard) 16%,transparent);color:var(--hard)}

  .goal{
    width:100%;max-width:520px;
    background:var(--panel);border:1px solid var(--panel-edge);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:16px;padding:11px 16px;margin:8px 0 4px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .goal .g-text{font-size:.92rem;font-weight:400;color:var(--haze)}
  .goal .g-text b{font-weight:700;font-size:1.25rem;color:var(--water-hi);margin:0 1px}
  .moves{text-align:right;font-size:.75rem;color:var(--haze);line-height:1.3;font-weight:500}
  .moves b{color:var(--chalk);font-size:1.1rem;font-weight:700}

  .stage{
    width:100%;max-width:520px;
    display:flex;align-items:center;justify-content:center;
    flex:1;padding:20px 0 14px;
  }
  .shelf{display:flex;align-items:flex-end;justify-content:center;gap:8px}
  .jug{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;user-select:none;transition:transform .15s}
  .jug:active{transform:scale(.97)}
  .jug .amt{font-weight:700;font-size:1.15rem;color:var(--amount)}
  .jug svg{overflow:visible;filter:drop-shadow(0 18px 16px rgba(10,6,30,.55))}
  .jug .glassbody{fill:none;stroke:var(--glass);stroke-width:2.5;transition:stroke .2s,filter .2s}
  .jug .glasshandle{fill:none;stroke:var(--glass);stroke-width:7;stroke-linecap:round;transition:stroke .2s}
  /* Stemware only: the stem is a closed shape so both edges are drawn,
     and the far half of the rim is the cue that reads as an opening. */
  .jug .stemshape{fill:var(--tint);stroke:var(--glass);stroke-width:2.2;stroke-linejoin:round;transition:stroke .2s}
  .jug .rimback{fill:none;stroke:var(--glass);stroke-opacity:.45;stroke-width:2;transition:stroke .2s}
  .jug.sel .glassbody{stroke:#FFFFFF;stroke-width:3.5;filter:drop-shadow(0 0 10px rgba(216,255,246,.75));filter:drop-shadow(0 0 10px color-mix(in srgb,var(--foam) 75%,transparent))}
  .jug.sel .glasshandle,.jug.sel .stemshape,.jug.sel .rimback{stroke:#FFFFFF}
  .jug.hintflash .glassbody{stroke:var(--hint);stroke-width:3.5;filter:drop-shadow(0 0 10px rgba(255,180,88,.8));filter:drop-shadow(0 0 10px color-mix(in srgb,var(--hint) 80%,transparent))}
  .jug.hintflash .glasshandle,.jug.hintflash .stemshape,.jug.hintflash .rimback{stroke:var(--hint)}
  .jug .etch{fill:var(--etch);font-family:'Fredoka',sans-serif;font-weight:600;pointer-events:none}
  .jug.deny{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .waterrect{transition:y .5s cubic-bezier(.4,0,.2,1),height .5s cubic-bezier(.4,0,.2,1)}
  .surfg{transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .3s}
  .waterbub{animation:bub var(--bd,5s) linear var(--bdl,0s) infinite}
  @keyframes bub{to{transform:translateY(calc(-1*var(--bh)))}}
  .wavedrift{animation:drift var(--wd,4.5s) linear infinite}
  .wavedrift.rev{animation-duration:calc(var(--wd,4.5s)*1.7);animation-direction:reverse}
  @keyframes drift{to{transform:translateX(calc(-1*var(--lam)))}}
  /* Wine legs, the tears that run back down the glass wall. They stand in
     for the bubbles, which read as fizz - wrong for a still red.
     One run per pour and nothing after it, on the glass that was poured
     OUT of: the film is what the receding wine left behind, so the tears
     start at the level the glass was emptied from and run down to where
     it settled. A still red does not weep by itself, and the old loop
     kept sending fresh tears down glasses nobody had touched in a minute.
     They hang off their own group rather than the surface group, because
     surfg goes transparent when a glass empties - and a glass poured dry
     is exactly the one with the most wall to run down. runLegs sets the
     travel and the duration; the speed is what stays constant. */
  .leg{opacity:0}
  .legsg.legs .leg{animation:legfall var(--lg,5s) ease-in-out var(--ld,.45s) 1 both}
  @keyframes legfall{
    0%{transform:translateY(calc(-1*var(--ls)));opacity:0}
    14%{opacity:.5}
    80%{opacity:.18}
    100%{transform:translateY(0);opacity:0}
  }

  /* The stein's handle is a fistful of glass, not a jug's thumb loop. */
  html[data-skin="beer"] .glasshandle{stroke-width:9}
  /* The head on a stein of beer. It hangs inside the surface group, so it
     rides the beer line for free and render() never has to know which
     skin is on; the only thing scripted is the surge on a fresh pour
     (runHead). transform-box:fill-box puts the origin on the foam's own
     bottom edge - the beer line - so the head grows up into the stein
     instead of about the middle of the viewBox, which is where an SVG
     element's transform-origin would otherwise land. */
  .headg{transform-box:fill-box;transform-origin:50% 100%}
  .headg.surge{animation:head 1.6s cubic-bezier(.25,.8,.3,1) both}
  @keyframes head{from{transform:scaleY(1.65)}to{transform:scaleY(1)}}

  .controls{width:100%;max-width:520px;display:flex;gap:8px;margin-top:8px}
  button{
    flex:1;padding:13px 4px;border-radius:14px;
    font-family:'Fredoka';font-weight:600;font-size:.9rem;
    background:var(--panel);color:var(--chalk);
    border:1px solid var(--panel-edge);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    cursor:pointer;transition:transform .1s, background .15s;
  }
  button:active{transform:scale(.96)}
  button.primary{
    background:linear-gradient(180deg,var(--water-hi),var(--water-lo));
    color:var(--on-primary);border-color:transparent;font-weight:700;
  }
  button:disabled{opacity:.35;pointer-events:none}

  .overlay{
    position:fixed;inset:0;background:var(--scrim);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .win{
    background:var(--card);
    border:1px solid var(--panel-edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:22px;padding:26px 22px;
    width:min(90vw,380px);text-align:center;
    transform:translateY(12px);transition:transform .25s;
    max-height:86dvh;display:flex;flex-direction:column;
  }
  .overlay.show .win{transform:translateY(0)}
  .win h2{font-weight:700;font-size:1.5rem;margin-bottom:6px}
  .stars{font-size:2.1rem;letter-spacing:6px;margin:8px 0 4px;color:var(--amber)}
  .stars i{display:inline-block;font-style:normal}
  .overlay.show .stars i{animation:pop .45s cubic-bezier(.5,1.7,.5,1) backwards}
  .overlay.show .stars i:nth-child(2){animation-delay:.13s}
  .overlay.show .stars i:nth-child(3){animation-delay:.26s}
  @keyframes pop{from{transform:scale(0)}}
  .stars .off{color:rgba(255,255,255,.15)}
  .win p{color:var(--haze);font-size:.9rem;margin-bottom:18px;font-weight:400}
  .win button{width:100%}
  .win button + button{margin-top:8px}

  .grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    overflow-y:auto;margin:10px 0 16px;padding:2px;
  }
  .cell{
    aspect-ratio:1;border-radius:13px;
    border:1px solid var(--panel-edge);background:rgba(255,255,255,.05);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:600;font-size:1rem;cursor:pointer;color:var(--chalk);
  }
  .cell .cstars{font-size:.58rem;color:var(--amber);letter-spacing:1px;margin-top:2px;height:.8em}
  .cell.done{
    background:rgba(111,231,212,.16);background:color-mix(in srgb,var(--done) 16%,transparent);
    border-color:rgba(111,231,212,.45);border-color:color-mix(in srgb,var(--done) 45%,transparent);
  }
  .cell.cur{outline:2px solid var(--foam)}
  .cell.locked{opacity:.3;pointer-events:none}

  /* Sits in the flow above the button row, not on top of it - otherwise it
     covers "Hint" and "Restart" on short screens. */
  .update{
    display:flex;align-items:center;gap:12px;align-self:center;
    margin-top:10px;
    background:var(--card);border:1px solid var(--panel-edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:99px;padding:9px 9px 9px 18px;
    font-size:.85rem;font-weight:500;color:var(--chalk);
    box-shadow:0 10px 30px rgba(4,10,26,.5);
  }
  .update[hidden]{display:none}
  .update button{flex:0 0 auto;padding:8px 16px;border-radius:99px;font-size:.82rem}

  /* The skin change arrives as one gesture: a circle of the incoming
     backdrop grows out of the droplet, the skin swaps underneath it, then
     it fades. Cheaper and steadier than cross-fading every property. */
  .wipe{
    position:fixed;inset:0;z-index:9;pointer-events:none;
    clip-path:circle(0% at var(--ox,80%) var(--oy,4%));
  }
  .wipe[hidden]{display:none}
  .wipe.to-wine{background:radial-gradient(130% 90% at 50% -10%,#63213F 0%,#2C0D1D 45%,#150610 100%)}
  .wipe.to-beer{background:radial-gradient(130% 90% at 50% -10%,#6B4116 0%,#2A1A0B 45%,#140C05 100%)}
  .wipe.to-water{background:radial-gradient(130% 90% at 50% -10%,#4A3A78 0%,#241E44 45%,#171331 100%)}
  .wipe.go{transition:clip-path .62s cubic-bezier(.4,0,.2,1);clip-path:circle(150% at var(--ox,80%) var(--oy,4%))}
  .wipe.fade{transition:opacity .45s ease;opacity:0}

  @media (min-width:900px){
    .stage{max-width:760px}
    .jug .amt{font-size:1.35rem}
  }

  @media (prefers-reduced-motion:reduce){
    *,.waterrect,.surfg{transition:none !important;animation:none !important}
    .wavedrift,.waterbub,.overlay.show .stars i{animation:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="wordmark" id="wordmark"><h1 id="brand">Jugz</h1><div class="droplet" id="droplet"></div></div>
  <div class="lvltag"><span id="lvlname"></span><span id="diffbadge"></span></div>
</header>

<div class="goal">
  <div class="g-text">Measure out exactly <b id="goalL"></b> in any <span id="vesselWord">jug</span></div>
  <div class="moves">Pours<br><b id="moveCount">0</b><span id="optCount"></span></div>
</div>

<div class="stage" id="stage"></div>

<div class="update" id="updateBar" hidden>
  <span>New version available</span>
  <button class="primary" id="btnUpdate">Reload</button>
</div>

<div class="controls">
  <button id="btnUndo">Undo</button>
  <button id="btnHint">Hint</button>
  <button id="btnReset">Restart</button>
  <button id="btnLevels">Levels</button>
</div>

<div class="overlay" id="overlay">
  <div class="win">
    <h2>Solved!</h2>
    <div class="stars" id="stars"></div>
    <p id="winText"></p>
    <button class="primary" id="btnNext">Next level</button>
    <button id="btnReplay">Play again</button>
  </div>
</div>

<div class="overlay" id="lvlOverlay">
  <div class="win">
    <h2>Levels</h2>
    <div class="grid" id="lvlGrid"></div>
    <button id="btnCloseLvls">Close</button>
  </div>
</div>

<div class="wipe" id="wipe" hidden></div>

<script src="levels.js"></script>
<script>
/* ================= BFS core ================= */
function key(s){return s.join(',')}
function pours(caps,s){
  const out=[];
  for(let i=0;i<s.length;i++){
    if(s[i]===0)continue;
    for(let j=0;j<s.length;j++){
      if(i===j)continue;
      const amt=Math.min(s[i],caps[j]-s[j]);
      if(amt<=0)continue;
      const n=s.slice();n[i]-=amt;n[j]+=amt;
      out.push({from:i,to:j,state:n});
    }
  }
  return out;
}
function solveFrom(caps,state,goal){
  if(state.includes(goal))return [];
  const dist=new Map();dist.set(key(state),0);
  const via=new Map();
  let q=[state];
  while(q.length){
    const nq=[];
    for(const s of q){
      for(const p of pours(caps,s)){
        const k=key(p.state);
        if(dist.has(k))continue;
        dist.set(k,dist.get(key(s))+1);
        via.set(k,{move:{from:p.from,to:p.to},pk:key(s)});
        if(p.state.includes(goal)){
          const path=[];let cur=k;
          while(via.has(cur)){const v=via.get(cur);path.unshift(v.move);cur=v.pk;}
          return path;
        }
        nq.push(p.state);
      }
    }
    q=nq;
  }
  return null;
}

/* ================= Persistence ================= */
const SAVE_KEY='jugz_v1';
let save={current:0,stars:{},skin:'water'};
try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s&&typeof s==='object'&&s.stars)save=s;
}catch(e){/* localStorage absent or blocked: play without saving */}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
}

/* localStorage is best effort and may be discarded by the browser: WebKit
   clears script-writable storage after seven days without interaction, and
   Chrome evicts origins under disk pressure. Persistent storage is exempt.

   We only ask after PERSIST_AFTER cleared levels. Early requests are denied
   more often, and Firefox surfaces them as a dialog - nobody should meet
   that on their first page load. */
const PERSIST_AFTER=10;
let persistAsked=false;
async function askPersist(){
  if(persistAsked)return;
  persistAsked=true;
  const st=navigator.storage;
  if(!st||!st.persist)return;                      /* absent in older Safari */
  try{
    if(await st.persisted())return;                /* already granted */
    /* Ask whether it is even allowed before requesting. An explicit
       "denied" makes persist() a guaranteed no that merely looks like a bug.
       The name is unknown in some browsers and throws - try anyway. */
    try{
      const perm=await navigator.permissions.query({name:'persistent-storage'});
      if(perm.state==='denied')return;
    }catch(e){}
    /* console.debug lands on the Verbose level: visible when you look for it,
       silent otherwise. */
    console.debug('Jugz: persistent storage '+(await st.persist()?'granted':'denied'));
  }catch(e){}
}

/* ================= Skins =================
   Three vessels, one game. Everything skin-dependent is listed here: the
   colours live in CSS under html[data-skin], the words and the drawing
   live below. Nothing about the puzzle, the level bank or the saved stars
   changes with the skin, so switching mid-level is safe.

   SKINS is the order the hidden switch walks, so a fourth skin is a row
   in each table and an entry here - nothing else. */
const SKINS=['water','wine','beer'];
const UNIT={water:'L',wine:'U',beer:'S'};      /* S for Seidel */
const VESSEL={water:'jug',wine:'glass',beer:'stein'};
const VERB={water:'Solved',wine:'Poured',beer:'Tapped'};
const BRAND={water:'Jugz',wine:'Winez',beer:'Beerz'};
const THEME={water:'#241E44',wine:'#2C0D1D',beer:'#2A1A0B'};
let skin=SKINS.includes(save.skin)?save.skin:'water';

/* ================= Game state ================= */
let li=0, caps=[], state=[], history=[], moves=0, opt=0, goal=0, sel=-1, busy=false;
const stage=document.getElementById('stage');

function unlocked(i){return i===0||(save.stars[i-1]||0)>0;}
function diffLabel(m){
  if(m<=4)return['Easy','easy'];
  if(m<=7)return['Medium','mid'];
  return['Hard','hard'];
}

/* The optimal number of pours is revealed only once the level has been
   cleared. Before that, the length of the solution would be a giveaway. */
function labelGoal(){
  document.getElementById('goalL').textContent=goal+' '+UNIT[skin];
  document.getElementById('vesselWord').textContent=VESSEL[skin];
}

function showOpt(){
  const solved=(save.stars[li]||0)>0;
  document.getElementById('optCount').textContent=solved?(' / '+opt):'';
}

function loadLevel(i){
  li=Math.max(0,Math.min(i,LEVELS.length-1));
  const L=LEVELS[li];
  caps=L.caps.slice();goal=L.goal;opt=L.opt;
  state=[caps[0],0,0];history=[];moves=0;sel=-1;
  save.current=li;persist();
  document.getElementById('lvlname').textContent='Level '+(li+1)+' / '+LEVELS.length;
  const[dl,dc]=diffLabel(opt);
  document.getElementById('diffbadge').innerHTML='<span class="diff '+dc+'">'+dl+'</span>';
  labelGoal();
  showOpt();
  buildJugs();render();
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('lvlOverlay').classList.remove('show');
}

/* ================= Rendering ================= */
function wavePath(w2,lam,amp){
  let d='M0 0';let x=0,s=-1;
  while(x<w2){d+=' q '+(lam/4)+' '+(s*amp)+' '+(lam/2)+' 0';x+=lam/2;s*=-1;}
  d+=' V 7 H 0 Z';
  return d;
}
function jugSVG(idx,cap){
  const maxCap=Math.max(...caps);
  const H=Math.round(130+(cap/maxCap)*140);
  const bodyW=Math.round(64+(cap/maxCap)*36);
  const W=bodyW+30;
  const bx=6,x2=bx+bodyW;
  const path=`M ${bx} 14
    Q ${bx+7} 9 ${bx+15} 13
    L ${x2-8} 15
    Q ${x2-1} 16 ${x2-2} 25
    Q ${x2-9} ${Math.round(H*0.32)} ${x2-3} ${Math.round(H*0.55)}
    Q ${x2+3} ${Math.round(H*0.76)} ${x2-7} ${H-15}
    Q ${x2-9} ${H-10} ${x2-17} ${H-10}
    L ${bx+17} ${H-10}
    Q ${bx+9} ${H-10} ${bx+7} ${H-15}
    Q ${bx-3} ${Math.round(H*0.76)} ${bx+3} ${Math.round(H*0.55)}
    Q ${bx+9} ${Math.round(H*0.32)} ${bx+2} 25
    Q ${bx+1} 17 ${bx} 14 Z`;
  const handle=`M ${x2-4} 32
    C ${x2+22} ${Math.round(H*0.28)} ${x2+22} ${Math.round(H*0.52)} ${x2-5} ${Math.round(H*0.62)}`;
  const fs=Math.max(17,Math.round(H*0.13));
  const lam=Math.max(24,Math.round(bodyW/2));
  const w2=bodyW+2*lam;
  let bubbles='';
  for(let k=0;k<4;k++){
    const cx=bx+12+((idx*37+k*53)%(bodyW-24));
    const r=(1.6+((idx+k)%3)*0.7).toFixed(1);
    bubbles+='<circle class="waterbub" cx="'+cx+'" cy="'+(H-14)+'" r="'+r
      +'" fill="rgba(255,255,255,.4)" style="--bh:'+H+'px;--bd:'+(4.5+k*1.6+idx*0.7).toFixed(1)+'s;--bdl:'+(k*1.3).toFixed(1)+'s"/>';
  }
  /* data-top/data-bot is the band the liquid moves through. The jug is
     filled to the brim; a wine glass is not (see glassSVG), so render()
     reads it off the SVG instead of hardcoding it. */
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-top="20" data-bot="${H-10}">
    <defs>
      <clipPath id="clip${idx}"><path d="${path}"/></clipPath>
      <clipPath id="wclip${idx}"><rect class="waterrect" id="wrect${idx}" x="0" y="${H}" width="${W}" height="0"/></clipPath>
      <linearGradient id="wg${idx}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--water-hi)"/>
        <stop offset="1" stop-color="var(--water-lo)"/>
      </linearGradient>
    </defs>
    <path class="glasshandle" d="${handle}"/>
    <path d="${path}" fill="var(--tint)"/>
    <rect class="waterrect" id="water${idx}" clip-path="url(#clip${idx})"
      x="0" y="${H}" width="${W}" height="0" fill="url(#wg${idx})"/>
    <g clip-path="url(#clip${idx})"><g clip-path="url(#wclip${idx})">${bubbles}</g></g>
    <g clip-path="url(#clip${idx})">
      <g class="surfg" id="surfg${idx}" style="transform:translateY(${H}px);opacity:0">
        <g class="wavedrift rev" style="--lam:${lam}px;--wd:5.2s;transform-origin:0 0">
          <path d="${wavePath(w2,lam,2)}" fill="var(--water-hi)" fill-opacity=".5" transform="translate(-${lam} 2)"/>
        </g>
        <g class="wavedrift" style="--lam:${lam}px;--wd:4.2s">
          <path d="${wavePath(w2,lam,2.6)}" fill="var(--foam)" fill-opacity=".85" transform="translate(-${lam} 0)"/>
        </g>
      </g>
    </g>
    <path d="M ${bx+12} 32 Q ${bx+6} ${Math.round(H*0.55)} ${bx+13} ${H-24}"
      fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round"/>
    <path class="glassbody" d="${path}"/>
    <text class="etch" x="${bx+bodyW/2}" y="${Math.round(H*0.60)}" text-anchor="middle" font-size="${fs}">${cap} ${UNIT.water}</text>
  </svg>`;
}

/* ---- Winez: stemware ----
   Capacity drives bowl height, bowl width, belly bulge and stem length at
   once, so the three glasses of a level differ by silhouette and not only
   by size: the smallest reads as a port tulip, the largest as a burgundy
   balloon. Element ids match jugSVG exactly, so render() is skin-blind. */
function glassGeom(cap,maxCap){
  const r=cap/maxCap;
  const rimY=16;                          /* centre of the rim ellipse   */
  const ry=Math.round(5+r*3);             /* rim ellipse, minor radius   */
  const bowlH=Math.round(60+r*54);
  const bowlW=Math.round(52+r*46);
  const stemH=Math.round(46+r*54);
  const rimR=bowlW/2;
  const belly=rimR*(1+r*0.26);            /* tulip -> balloon            */
  const footRx=belly*0.78;
  const W=Math.ceil(2*belly+20);
  const cx=Math.round(W/2);
  const by=rimY+bowlH;                    /* bowl bottom = stem junction */
  const footY=by+stemH;
  return {rimY,ry,bowlH,bowlW,stemH,rimR,belly,footRx,W,cx,by,footY,H:footY+12};
}
function glassSVG(idx,cap){
  const g=glassGeom(cap,Math.max(...caps));
  const n=4;                              /* half-width at the neck      */
  const bowl=`M ${g.cx-g.rimR} ${g.rimY}
    C ${(g.cx-g.belly).toFixed(1)} ${(g.rimY+g.bowlH*0.36).toFixed(1)}
      ${(g.cx-g.belly*0.90).toFixed(1)} ${(g.rimY+g.bowlH*0.74).toFixed(1)}
      ${g.cx-n} ${g.by}
    L ${g.cx+n} ${g.by}
    C ${(g.cx+g.belly*0.90).toFixed(1)} ${(g.rimY+g.bowlH*0.74).toFixed(1)}
      ${(g.cx+g.belly).toFixed(1)} ${(g.rimY+g.bowlH*0.36).toFixed(1)}
      ${g.cx+g.rimR} ${g.rimY}
    A ${g.rimR} ${g.ry} 0 0 1 ${g.cx-g.rimR} ${g.rimY} Z`;
  /* The near half of the rim closes the bowl above; the far half is drawn
     separately and faintly. Without it the shape reads as a cone. */
  const rimBack=`M ${g.cx-g.rimR} ${g.rimY} A ${g.rimR} ${g.ry} 0 0 1 ${g.cx+g.rimR} ${g.rimY}`;
  const stem=`M ${g.cx-n} ${g.by}
    C ${g.cx-3.6} ${(g.by+g.stemH*0.5).toFixed(1)} ${g.cx-3.8} ${g.footY-18} ${g.cx-8} ${g.footY-2}
    L ${g.cx+8} ${g.footY-2}
    C ${g.cx+3.8} ${g.footY-18} ${g.cx+3.6} ${(g.by+g.stemH*0.5).toFixed(1)} ${g.cx+n} ${g.by} Z`;
  const shine=`M ${(g.cx-g.rimR*0.60).toFixed(1)} ${g.rimY+12}
    Q ${(g.cx-g.belly*0.88).toFixed(1)} ${(g.rimY+g.bowlH*0.48).toFixed(1)}
      ${(g.cx-g.rimR*0.34).toFixed(1)} ${g.by-10}`;
  const fs=Math.max(14,Math.round(g.bowlW*0.24));
  const lam=Math.max(24,Math.round(g.bowlW/2));
  const w2=Math.round(2*g.belly)+2*lam;
  /* Only the horizontal placing and the stagger are fixed here. How far a
     tear falls is not knowable until a pour happens, so runLegs writes
     --ls and --lg. */
  let legs='';
  for(let k=0;k<3;k++){
    const lx=(g.cx-g.rimR*0.55+(g.rimR*1.1/2)*k+((idx*7+k*11)%9)).toFixed(1);
    legs+='<line class="leg" x1="'+lx+'" y1="0" x2="'+lx+'" y2="13" stroke="var(--foam)"'
      +' stroke-width="2" stroke-linecap="round" style="--ld:'
      +(0.45+k*0.16+(idx%3)*0.05).toFixed(2)+'s"/>';
  }
  /* The band stops at the bottom of the bowl: the jug's band would pour
     wine down into the stem. */
  return `<svg width="${g.W}" height="${g.H}" viewBox="0 0 ${g.W} ${g.H}" data-top="${g.rimY+2}" data-bot="${g.by-3}">
    <defs>
      <clipPath id="clip${idx}"><path d="${bowl}"/></clipPath>
      <clipPath id="wclip${idx}"><rect class="waterrect" id="wrect${idx}" x="0" y="${g.H}" width="${g.W}" height="0"/></clipPath>
      <linearGradient id="wg${idx}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--water-hi)"/>
        <stop offset="1" stop-color="var(--water-lo)"/>
      </linearGradient>
    </defs>
    <ellipse cx="${g.cx}" cy="${g.footY}" rx="${g.footRx.toFixed(1)}" ry="6" fill="var(--tint)" stroke="var(--glass)" stroke-width="2.2"/>
    <path class="stemshape" d="${stem}"/>
    <path d="${bowl}" fill="var(--tint)"/>
    <rect class="waterrect" id="water${idx}" clip-path="url(#clip${idx})"
      x="0" y="${g.H}" width="${g.W}" height="0" fill="url(#wg${idx})"/>
    <g clip-path="url(#clip${idx})">
      <g class="surfg" id="surfg${idx}" style="transform:translateY(${g.H}px);opacity:0">
        <g class="wavedrift rev" style="--lam:${lam}px;--wd:5.2s;transform-origin:0 0">
          <path d="${wavePath(w2,lam,2)}" fill="var(--water-hi)" fill-opacity=".5" transform="translate(-${lam} 2)"/>
        </g>
        <g class="wavedrift" style="--lam:${lam}px;--wd:4.2s">
          <path d="${wavePath(w2,lam,2.6)}" fill="var(--foam)" fill-opacity=".85" transform="translate(-${lam} 0)"/>
        </g>
      </g>
      <g class="legsg" id="legsg${idx}" style="transform:translateY(${g.H}px)">${legs}</g>
    </g>
    <path d="${shine}" fill="none" stroke="rgba(255,255,255,.40)" stroke-width="3" stroke-linecap="round"/>
    <path class="rimback" d="${rimBack}"/>
    <path class="glassbody" d="${bowl}"/>
    <text class="etch" x="${g.cx}" y="${Math.round(g.rimY+g.bowlH*0.62)}" text-anchor="middle" font-size="${fs}">${cap} ${UNIT.wine}</text>
  </svg>`;
}
/* ---- Beerz: the German stein ----
   A dimpled Masskrug: near-straight walls with a slight draw towards the
   base, a thick D-handle, pressed dimples across the glass and a head of
   foam on top. Capacity drives height, width and the depth of the head
   together. The element ids are jugSVG's and glassSVG's again, so
   render() stays skin-blind.

   Two things are the stein's own. The band stops well short of the rim -
   data-top leaves the head room to stand inside the glass, the way the
   wine band stops at the bottom of the bowl - and the foam sits inside
   surfg rather than beside it, so it rides the beer line with no help
   from render(). The bubbles come back here: fizz is wrong for a still
   red and exactly right for a lager. */
function steinGeom(cap,maxCap){
  const r=cap/maxCap;
  const bodyW=Math.round(68+r*44);
  const H=Math.round(146+r*104);
  const rimY=14;                          /* centre of the rim ellipse   */
  const ry=Math.round(6+r*3);             /* rim ellipse, minor radius   */
  const bx=8,x2=bx+bodyW;
  const baseY=H-16;                       /* the inside of the base      */
  const taper=Math.round(bodyW*0.05);     /* the walls draw in a little  */
  const head=Math.round(12+r*9);          /* the foam head, at rest      */
  const W=bodyW+40;                       /* room for the handle         */
  return {r,bodyW,H,rimY,ry,bx,x2,baseY,taper,head,W,rimR:bodyW/2};
}
/* The top of the head, lumpy rather than level: a straight edge reads as
   a lid. Drawn in the surface group's own coordinates, where y=0 is the
   beer line and the foam stands above it. */
function foamPath(x0,x1,hh){
  const n=4,step=(x1-x0)/n;
  let d='M '+x0+' 0 L '+x0+' '+(-hh*0.62).toFixed(1);
  for(let k=0;k<n;k++){
    const sx=x0+k*step;
    d+=' Q '+(sx+step*0.25).toFixed(1)+' '+(-hh*(k%2?1.12:0.94)).toFixed(1)
      +' '+(sx+step*0.5).toFixed(1)+' '+(-hh*0.82).toFixed(1)
      +' Q '+(sx+step*0.76).toFixed(1)+' '+(-hh*(k%2?0.58:0.72)).toFixed(1)
      +' '+(sx+step).toFixed(1)+' '+(-hh*0.80).toFixed(1);
  }
  d+=' L '+x1+' 0 Z';
  return d;
}
function steinSVG(idx,cap){
  const g=steinGeom(cap,Math.max(...caps));
  const {bx,x2,rimY,ry,baseY,taper,bodyW,H,W,rimR}=g;
  const body=`M ${bx} ${rimY}
    L ${bx+taper} ${baseY-12}
    Q ${bx+taper} ${baseY} ${bx+taper+12} ${baseY}
    L ${x2-taper-12} ${baseY}
    Q ${x2-taper} ${baseY} ${x2-taper} ${baseY-12}
    L ${x2} ${rimY}
    A ${rimR} ${ry} 0 0 1 ${bx} ${rimY} Z`;
  /* The far half of the rim, faint - the same trick as the wine glass:
     without it the mouth of the stein reads as a flat top. */
  const rimBack=`M ${bx} ${rimY} A ${rimR} ${ry} 0 0 1 ${x2} ${rimY}`;
  const wall=baseY-rimY;
  /* A stein is carried by the fist, so the handle is a wide D standing
     off the wall - not the thumb loop a jug gets. */
  const handle=`M ${x2-4} ${Math.round(rimY+wall*0.15)}
    C ${x2+24} ${Math.round(rimY+wall*0.17)} ${x2+26} ${Math.round(rimY+wall*0.34)} ${x2+25} ${Math.round(rimY+wall*0.46)}
    C ${x2+24} ${Math.round(rimY+wall*0.58)} ${x2+18} ${Math.round(rimY+wall*0.68)} ${x2-6} ${Math.round(rimY+wall*0.70)}`;
  const shine=`M ${bx+12} ${rimY+26} Q ${bx+6} ${Math.round(rimY+wall*0.55)} ${bx+14} ${baseY-26}`;
  const fs=Math.max(17,Math.round(H*0.12));
  const lam=Math.max(24,Math.round(bodyW/2));
  const w2=bodyW+2*lam;
  let bubbles='';
  for(let k=0;k<4;k++){
    const cx=bx+12+((idx*37+k*53)%Math.max(12,bodyW-24));
    const r=(1.6+((idx+k)%3)*0.7).toFixed(1);
    bubbles+='<circle class="waterbub" cx="'+cx+'" cy="'+(baseY-4)+'" r="'+r
      +'" fill="rgba(255,255,255,.4)" style="--bh:'+H+'px;--bd:'+(4.5+k*1.6+idx*0.7).toFixed(1)+'s;--bdl:'+(k*1.3).toFixed(1)+'s"/>';
  }
  /* The pressed dimples of a Masskrug, drawn over the beer as well as
     over the empty glass: they are the wall, not a decoration on it. */
  let dimples='';
  const dr=Math.max(6,Math.round(bodyW*0.12)),gap=Math.round(dr*2.7);
  const rows=Math.max(2,Math.floor((wall-40)/gap));
  const etchY=Math.round(rimY+wall*0.66);
  for(let ri=0;ri<rows;ri++){
    const dy=rimY+34+ri*gap;
    /* The band the capacity is etched on stays smooth, the way the fill
       mark on a real Masskrug does. Dimpling straight through the number
       is what makes it hard to read. */
    if(Math.abs(dy-etchY)<fs*0.8)continue;
    /* Three across, then two set between them: a straight grid reads as
       polka dots, the offset row reads as pressed glass. */
    const at=(ri%2)?[0.34,0.66]:[0.19,0.5,0.81];
    for(const f of at)
      dimples+='<ellipse cx="'+(bx+bodyW*f).toFixed(1)+'" cy="'+dy+'" rx="'+dr+'" ry="'+(dr*0.88).toFixed(1)
        +'" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.15)" stroke-width="1.4"/>';
  }
  const hh=g.head;
  let holes='';
  for(let k=0;k<5;k++){
    const hx=(bx+8+((idx*23+k*41)%Math.max(12,bodyW-16))).toFixed(1);
    holes+='<circle cx="'+hx+'" cy="'+(-hh*(0.28+0.14*(k%3))).toFixed(1)+'" r="'
      +(1.5+(k%3)*0.5).toFixed(1)+'" fill="var(--water-lo)" fill-opacity=".16"/>';
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-top="${rimY+hh+6}" data-bot="${baseY-3}">
    <defs>
      <clipPath id="clip${idx}"><path d="${body}"/></clipPath>
      <clipPath id="wclip${idx}"><rect class="waterrect" id="wrect${idx}" x="0" y="${H}" width="${W}" height="0"/></clipPath>
      <linearGradient id="wg${idx}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--water-hi)"/>
        <stop offset="1" stop-color="var(--water-lo)"/>
      </linearGradient>
    </defs>
    <path class="glasshandle" d="${handle}"/>
    <path d="${body}" fill="var(--tint)"/>
    <rect class="waterrect" id="water${idx}" clip-path="url(#clip${idx})"
      x="0" y="${H}" width="${W}" height="0" fill="url(#wg${idx})"/>
    <g clip-path="url(#clip${idx})"><g clip-path="url(#wclip${idx})">${bubbles}</g></g>
    <g clip-path="url(#clip${idx})">
      <g class="surfg" id="surfg${idx}" style="transform:translateY(${H}px);opacity:0">
        <g class="wavedrift rev" style="--lam:${lam}px;--wd:5.2s;transform-origin:0 0">
          <path d="${wavePath(w2,lam,2)}" fill="var(--water-hi)" fill-opacity=".5" transform="translate(-${lam} 2)"/>
        </g>
        <g class="wavedrift" style="--lam:${lam}px;--wd:4.2s">
          <path d="${wavePath(w2,lam,2.6)}" fill="var(--water-hi)" fill-opacity=".55" transform="translate(-${lam} 0)"/>
        </g>
        <g class="headg" id="headg${idx}">
          <path d="${foamPath(bx-3,x2+3,hh)}" fill="var(--foam)"/>
          ${holes}
        </g>
      </g>
      ${dimples}
    </g>
    <path d="${shine}" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="3" stroke-linecap="round"/>
    <path class="rimback" d="${rimBack}"/>
    <path class="glassbody" d="${body}"/>
    <text class="etch" x="${bx+bodyW/2}" y="${etchY}" text-anchor="middle" font-size="${fs}">${cap} ${UNIT.beer}</text>
  </svg>`;
}
function vesselSVG(idx,cap){
  if(skin==='wine')return glassSVG(idx,cap);
  if(skin==='beer')return steinSVG(idx,cap);
  return jugSVG(idx,cap);
}

function buildJugs(){
  stage.innerHTML='';
  const shelf=document.createElement('div');
  shelf.className='shelf';
  caps.forEach((cap,i)=>{
    const d=document.createElement('div');
    d.className='jug';d.id='jug'+i;
    d.innerHTML=vesselSVG(i,cap)+`<div class="amt" id="amt${i}"></div>`;
    d.addEventListener('click',()=>tap(i));
    shelf.appendChild(d);
  });
  stage.appendChild(shelf);
  fitJugs();
}

function fitJugs(){
  const svgs=[...stage.querySelectorAll('svg')];
  if(!svgs.length)return;
  const natW=svgs.reduce((t,s)=>t+(+s.getAttribute('width')),0)+8*(svgs.length-1);
  const natH=Math.max(...svgs.map(s=>+s.getAttribute('height')));
  const availW=(stage.clientWidth||Math.min(window.innerWidth-24,520))-6;
  const availH=Math.max(150,(stage.clientHeight||320)-60); /* room for the number below */
  const sc=Math.min(availW/natW,availH/natH,1.9);
  svgs.forEach(s=>{
    s.style.width=((+s.getAttribute('width'))*sc)+'px';
    s.style.height=((+s.getAttribute('height'))*sc)+'px';
  });
}
window.addEventListener('resize',fitJugs);

function render(){
  caps.forEach((cap,i)=>{
    const svg=document.querySelector('#jug'+i+' svg');
    const topY=+svg.dataset.top,botY=+svg.dataset.bot,usable=botY-topY;
    const h=(state[i]/cap)*usable;
    const y=botY-h;
    const w=document.getElementById('water'+i);
    w.setAttribute('y',y);
    w.setAttribute('height',h);
    const wr=document.getElementById('wrect'+i);
    wr.setAttribute('y',y);
    wr.setAttribute('height',h);
    const sg=document.getElementById('surfg'+i);
    sg.style.transform='translateY('+y+'px)';
    sg.style.opacity=state[i]>0?1:0;
    document.getElementById('amt'+i).textContent=state[i]+' '+UNIT[skin];
    const j=document.getElementById('jug'+i);
    j.classList.toggle('sel',sel===i);
    /* Gold once it is the amount asked for; liquid colour while there is
       liquid; and greyed out at empty, where a bright number would still
       read as a measurement. The etched capacity never changes, so the
       moving number is the one that carries colour. */
    document.getElementById('amt'+i).style.color=
      (state[i]===goal)?'var(--gold)':(state[i]>0?'var(--amount)':'var(--haze)');
  });
  document.getElementById('moveCount').textContent=moves;
  document.getElementById('btnUndo').disabled=history.length===0;
}

/* ================= Level picker ================= */
function openLevels(){
  const g=document.getElementById('lvlGrid');
  g.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const c=document.createElement('div');
    const st=save.stars[i]||0;
    c.className='cell'+(st>0?' done':'')+(i===li?' cur':'')+(unlocked(i)?'':' locked');
    c.innerHTML=(i+1)+'<div class="cstars">'+('★'.repeat(st))+'</div>';
    c.addEventListener('click',()=>loadLevel(i));
    g.appendChild(c);
  });
  document.getElementById('lvlOverlay').classList.add('show');
}

/* ================= Interaction ================= */
function tap(i){
  if(busy)return;
  if(sel===-1){
    if(state[i]===0){deny(i);return;}
    sel=i;render();return;
  }
  if(sel===i){sel=-1;render();return;}
  const amt=Math.min(state[sel],caps[i]-state[i]);
  if(amt<=0){deny(i);return;}
  const from=sel,fell=state[sel];  /* both cleared below; the legs need them */
  history.push(state.slice());
  state[sel]-=amt;state[i]+=amt;
  moves++;sel=-1;busy=true;
  render();
  runLegs(from,fell);
  runHead(i);
  setTimeout(()=>{busy=false;checkWin();},520);
}
/* One run of the legs down the wall a pour just laid bare: from the level
   glass i was emptied from (was) to where it settled. Everything the tears
   need is that band, so it is measured here rather than baked into the SVG.

   LEG_SPEED keeps the trickle at one pace whatever the band is - a fixed
   duration made a long drain race and a short one crawl. A band under
   MIN_BAND is not worth a tear; it would be shorter than the tear itself.

   Restarting means dropping the class and forcing a reflow before putting
   it back, or the browser never sees it leave and a second pour from the
   same glass does nothing. The reflow is getBoundingClientRect, not the
   offsetWidth trick used on the droplet: legsg is an SVG <g>, and SVG
   elements have no offsetWidth to read. */
const LEG_SPEED=9, MIN_BAND=12, LEG_MIN=3.5, LEG_MAX=11;
function runLegs(i,was){
  if(skin!=='wine')return;
  const lg=document.getElementById('legsg'+i);
  if(!lg)return;
  const svg=document.querySelector('#jug'+i+' svg');
  const usable=(+svg.dataset.bot)-(+svg.dataset.top);
  const y=a=>(+svg.dataset.bot)-(a/caps[i])*usable;
  const band=y(state[i])-y(was);
  lg.classList.remove('legs');
  if(band<MIN_BAND)return;
  /* The group parks at the new wine line and the tears fall to it, so the
     band is the whole of their travel. No transition on legsg: it has to
     be in place before the run starts, not slide there with the level. */
  lg.style.transform='translateY('+y(state[i])+'px)';
  const secs=Math.min(LEG_MAX,Math.max(LEG_MIN,band/LEG_SPEED));
  lg.querySelectorAll('.leg').forEach((l,k)=>{
    l.style.setProperty('--ls',band.toFixed(1)+'px');
    l.style.setProperty('--lg',(secs*(1+k*0.14)).toFixed(2)+'s');
  });
  lg.getBoundingClientRect();lg.classList.add('legs');
}
/* The head of a stein that has just been filled: foam stands high on a
   fresh pour and settles over the next second and a half. The mirror of
   the wine legs - those run down the glass poured OUT of, this one rises
   in the stein poured INTO - and a loop would be wrong for the same
   reason: beer at rest does not re-foam.

   Nothing is measured here. The foam rides inside surfg, so it is already
   at the new beer line; all that is scripted is the settling. Restarting
   the animation needs the class to leave and come back with a forced
   reflow between, and the read is getBoundingClientRect for the same
   reason as the legs: an SVG <g> has no offsetWidth. */
function runHead(i){
  if(skin!=='beer')return;
  const hg=document.getElementById('headg'+i);
  if(!hg)return;
  hg.classList.remove('surge');
  hg.getBoundingClientRect();
  hg.classList.add('surge');
}
function deny(i){
  const j=document.getElementById('jug'+i);
  j.classList.remove('deny');void j.offsetWidth;j.classList.add('deny');
}
function checkWin(){
  if(!state.includes(goal))return;
  const n=(moves<=opt)?3:(moves<=opt+2)?2:1;
  save.stars[li]=Math.max(save.stars[li]||0,n);
  persist();
  showOpt();
  if(Object.keys(save.stars).length>=PERSIST_AFTER)askPersist();
  document.getElementById('stars').innerHTML=
    '<i>★</i>'.repeat(n)+'<i class="off">★</i>'.repeat(3-n);
  document.getElementById('winText').textContent=
    moves===opt?'Perfect! '+VERB[skin]+' in the optimal '+opt+' pours.':
    VERB[skin]+' in '+moves+' pours. The optimum is '+opt+'.';
  document.getElementById('btnNext').style.display=(li<LEVELS.length-1)?'':'none';
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('btnUndo').onclick=()=>{
  if(!history.length||busy)return;
  /* Undo is an alternative to restarting, not a move of its own: the pour
     is counted back off. history.length guarantees moves>0. */
  state=history.pop();moves--;sel=-1;render();
};
document.getElementById('btnReset').onclick=()=>loadLevel(li);
document.getElementById('btnHint').onclick=()=>{
  if(busy)return;
  const path=solveFrom(caps,state,goal);
  if(!path||!path.length)return;
  const m=path[0];sel=-1;render();
  ['jug'+m.from,'jug'+m.to].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.add('hintflash');
    setTimeout(()=>el.classList.remove('hintflash'),1200);
  });
};
document.getElementById('btnLevels').onclick=openLevels;
document.getElementById('btnCloseLvls').onclick=()=>document.getElementById('lvlOverlay').classList.remove('show');
document.getElementById('btnNext').onclick=()=>loadLevel(li+1);
document.getElementById('btnReplay').onclick=()=>loadLevel(li);

/* ================= Switching skin =================
   Hidden on purpose: three taps on the logo, each following the one
   before it. One tap would fire by accident, and an entry in the level
   screen would give the joke away before anyone found it. The switch
   walks SKINS in order rather than toggling, so three taps more carry on
   to the next skin and eventually back to the water. */
function paintSkin(){
  document.documentElement.dataset.skin=skin;
  document.getElementById('brand').textContent=BRAND[skin];
  const tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.setAttribute('content',THEME[skin]);
}
function applySkin(next){
  skin=next;
  save.skin=skin;persist();
  paintSkin();labelGoal();
  buildJugs();render();     /* the skins share ids, not geometry */
}

const REDUCED=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let swapping=false;
function swapSkin(){
  if(swapping||busy)return false;
  const next=SKINS[(SKINS.indexOf(skin)+1)%SKINS.length];
  if(REDUCED){applySkin(next);return true;}
  swapping=true;
  /* A circle of the incoming backdrop grows out of the droplet, the skin
     changes underneath it, then it fades off. */
  const wipe=document.getElementById('wipe');
  const d=document.getElementById('droplet').getBoundingClientRect();
  wipe.style.setProperty('--ox',Math.round(100*(d.left+d.width/2)/window.innerWidth)+'%');
  wipe.style.setProperty('--oy',Math.round(100*(d.top+d.height/2)/window.innerHeight)+'%');
  wipe.className='wipe to-'+next;
  wipe.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>wipe.classList.add('go')));
  setTimeout(()=>{
    applySkin(next);
    wipe.classList.add('fade');
    setTimeout(()=>{wipe.hidden=true;wipe.className='wipe';swapping=false;},460);
  },650);
  return true;
}

/* A chain, not a fixed window: each tap only has to follow the one before
   it within TAP_GAP. Three taps at a hesitant rhythm still pass, three
   spread over a minute never do. A fixed total window punished exactly the
   person who is still working out that the logo does anything at all -
   they tap, look, tap, look, and the run expires under them. */
const TAP_GAP=900;
let taps=0,lastTap=-1e9;
function countTap(){
  /* The wipe is running: further taps are impatience, not a second run. */
  if(swapping)return;
  const now=performance.now();
  taps=(now-lastTap<TAP_GAP)?taps+1:1;
  lastTap=now;
  /* From the second tap on the droplet lights up. One stray tap does
     nothing at all; a repeat says "keep going". Without that the switch is
     not merely secret, it is undiscoverable. */
  if(taps>=2){
    const d=document.getElementById('droplet');
    d.classList.remove('ping');void d.offsetWidth;d.classList.add('ping');
  }
  /* swapSkin refuses while a pour is still animating. Leave the run
     standing so the next tap completes it instead of starting over. */
  if(taps>=3&&swapSkin())taps=0;
}
/* pointerdown, not click. The wordmark has no cursor:pointer - that is
   what keeps it from advertising itself - and iOS Safari withholds click
   from an element it does not read as clickable. Every other tap target
   in the game (.jug, button, .cell) does carry the pointer cursor, which
   is why they were never affected. */
const wm=document.getElementById('wordmark');
if(window.PointerEvent)wm.addEventListener('pointerdown',countTap);
else wm.addEventListener('click',countTap);

paintSkin();
loadLevel(unlocked(save.current)?save.current:0);

/* ================= Service worker ================= */
/* Fails silently on file:// and other insecure origins. */
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    let wantReload=false;
    /* controllerchange also fires when the very first worker takes over, so
       we only reload when the user actually asked for it. */
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(wantReload)location.reload();
    });
    try{
      /* updateViaCache:'none' makes sw.js always come from the server;
         otherwise the HTTP cache can hide that a new version exists. */
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      const bar=document.getElementById('updateBar');
      const offer=w=>{
        if(!w||!navigator.serviceWorker.controller)return; /* first install, not an update */
        bar.hidden=false;
        document.getElementById('btnUpdate').onclick=()=>{
          wantReload=true;bar.hidden=true;
          w.postMessage({type:'SKIP_WAITING'});
        };
      };
      if(reg.waiting)offer(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;
        if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)});
      });
      reg.update().catch(()=>{});
    }catch(e){}
  });
}
</script>
</body>
